name: Build, Push, and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get build versions
        id: versions
        shell: bash
        run: |
          echo "alpine=$(grep '^ARG ALPINE_VERSION=' build/Dockerfile | head -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "threeproxy=$(grep '^ARG THREEPROXY_VERSION=' build/Dockerfile | head -1 | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Prepare image tags
        id: image_tags
        shell: bash
        run: |
          {
            echo "tags<<EOF"

            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "ghcr.io/${{ github.repository_owner }}/simplesocks5:${GITHUB_REF_NAME}"
            fi

            echo "ghcr.io/${{ github.repository_owner }}/simplesocks5:latest"
            echo "ghcr.io/${{ github.repository_owner }}/simplesocks5:alpine"

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./build
          file: ./build/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Docker images based on

            Alpine ${{ steps.versions.outputs.alpine }}
            3proxy ${{ steps.versions.outputs.threeproxy }}

            (simplesocks5:latest)
